name: Test and Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  # Manueller Start (Actions -> "Test and Lint" -> Run workflow); nur dann laeuft auch der E2E-Job.
  workflow_dispatch:
    inputs:
      e2e:
        description: 'E2E-Tests (Neuinstallation + Upgrade 2.4.1 -> aktueller Stand) ausfuehren'
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: test_root
          MARIADB_DATABASE: test_db
          MARIADB_USER: test_user
          MARIADB_PASSWORD: test_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          # Aus dem voll gepinnten Lockfile installieren -> CI testet exakt die Versionen,
          # die auch im Docker-Image landen (verhindert "geht in CI, bricht in Prod").
          pip install -r requirements.lock
          pip install pytest pytest-asyncio pytest-cov

      # Migrations-Gate zuerst und allein: braucht eine frische Datenbank (2.4.1-Schema -> 3.0).
      - name: Run migration tests (fresh DB)
        env:
          DATABASE_URL: mysql+aiomysql://test_user:test_pass@localhost:3306/test_db
          JWT_SECRET_KEY: test-secret-key
          RUN_DB_TESTS: '1'
        run: |
          cd backend
          pytest tests/test_migrations_db.py --cov=app --cov-report=

      # Alle uebrigen Tests inkl. wave_integration (-m "" hebt den Standardfilter aus pytest.ini auf).
      - name: Run tests
        env:
          DATABASE_URL: mysql+aiomysql://test_user:test_pass@localhost:3306/test_db
          JWT_SECRET_KEY: test-secret-key
          RUN_DB_TESTS: '1'
        run: |
          cd backend
          pytest --ignore=tests/test_migrations_db.py -m "" --cov=app --cov-append --cov-report=term-missing

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run linter
        run: |
          cd frontend
          npm run lint

      - name: Check locales (keys, plurals, placeholders, untranslated)
        run: |
          cd frontend
          npm run check:locales -- --strict

      - name: Unit tests (pure modules, locale checker)
        run: |
          cd frontend
          npm test

      - name: Build frontend
        run: |
          cd frontend
          npm run build

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: dns-manager:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # E2E gegen echte MariaDB + 2x PowerDNS + Webhook-Empfaenger (scripts/e2e/README.md).
  # Nur bei manuellem Start; laeuft isoliert im Projekt pdnsmgr-e2e (keine festen Host-Ports).
  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # Tag v2.4.1 fuer den Upgrade-Pfad

      - name: Static checks
        run: scripts/e2e/static-checks.sh

      - name: E2E fresh install
        run: scripts/e2e/run-e2e.sh

      - name: E2E upgrade 2.4.1 -> current
        run: scripts/e2e/upgrade-241-to-30.sh --no-build
