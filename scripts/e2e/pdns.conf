# PowerDNS-Konfiguration fuer die E2E-Container pdnsmgr-e2e-pdns1/-pdns2 (powerdns/pdns-auth-49).
# Wird nach /etc/powerdns/pdns.d/e2e.conf gemountet (das Image laedt include-dir=/etc/powerdns/pdns.d,
# Backend gsqlite3 mit DNSSEC). Der API-Key kommt je Server per Kommandozeile (--api-key=...) aus
# compose.e2e.yaml, damit beide Server unterschiedliche Schluessel haben (deckt Verwechslungen auf).
# Nur fuer das isolierte Netz pdnsmgr-e2e-net gedacht – NIE in Produktion verwenden.

# HTTP-API und Webserver (nur im E2E-Netz erreichbar, kein Host-Port)
api=yes
webserver=yes
webserver-address=0.0.0.0
webserver-port=8081
webserver-allow-from=0.0.0.0/0

# LUA-Records (F15) und DNSSEC-Funktionen (F4) sollen testbar sein
enable-lua-records=yes
default-soa-content=ns1.@ hostmaster.@ 0 10800 3600 604800 3600

# Primary-Verhalten fuer NOTIFY-Tests (F2); ohne Secondaries passiert nichts
primary=yes

# Logging moderat (5 = notice); bei Fehlersuche per E2E_PDNS_LOGLEVEL in compose.e2e.yaml erhoehen
loglevel=5
