[pytest]
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# Tests, die Code eines parallelen Workstreams derselben Welle brauchen, tragen den Marker
# wave_integration (Bauplan Regel 3 [F19]). Sie laufen im Integrationsschritt verpflichtend mit
# "pytest -m ''" (ein spaeteres -m ueberschreibt das aus addopts).
markers =
    wave_integration: braucht Code eines parallelen Workstreams; laeuft im Integrationsschritt (pytest -m "")
addopts = -m "not wave_integration"
# Nicht abgewartete Coroutinen (z. B. vergessenes await vor einem async Helfer) sind Fehler:
# Python meldet sie beim Aufraeumen als "unraisable" Warnung, pytest verpackt sie in
# PytestUnraisableExceptionWarning – beide Formen werden zu Testfehlern.
filterwarnings =
    ignore::DeprecationWarning
    error:coroutine .* was never awaited:RuntimeWarning
    error:Exception ignored in. <coroutine object:pytest.PytestUnraisableExceptionWarning
